name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate code
        run: npm run generate
      - name: Format
        run: npx prettier --check "src/**/*.{js,ts}" --no-error-on-unmatched-pattern
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run unit tests
        run: npm test -- --runInBand --passWithNoTests --testPathPattern="(^|/)(unit|units)(/|\\.)|\\.unit\\."

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run integration tests
        run: npm test -- --runInBand --passWithNoTests --testPathPattern="(^|/)(integration|integrations)(/|\\.)|\\.integration\\."

  functional-tests:
    name: Functional tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run functional tests
        run: npm test -- --runInBand --passWithNoTests --testPathPattern="(^|/)(functional|functionals)(/|\\.)|\\.functional\\."
