name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate code
        run: npm run generate
      - name: Format
        run: npx prettier --check "src/**/*.{js,ts}" --no-error-on-unmatched-pattern
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run unit tests
        run: npm test -- --runInBand --coverage --passWithNoTests --testPathPattern="(^|/)(unit|units)(/|\\.)|\\.unit\\."

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run integration tests
        run: npm test -- --runInBand --coverage --passWithNoTests --testPathPattern="(^|/)(integration|integrations)(/|\\.)|\\.integration\\."

  functional-tests:
    name: Functional tests
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seenons
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prepare environment
        run: npm run env:prepare
      - name: Prepare database
        run: npm run db:migrate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Start application
        run: |
          npm run start:dev > /tmp/backend-template.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/todo > /dev/null; then
              break
            fi
            sleep 1
          done
      - name: Run functional tests
        run: npm test -- --runInBand --coverage --passWithNoTests --testPathPattern="(^|/)(functional|functionals)(/|\\.)|\\.functional\\."
